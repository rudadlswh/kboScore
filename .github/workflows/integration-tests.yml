name: Collector Integration Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  collector-integration:
    name: collector-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminkbo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/collector

    env:
      TEST_DATABASE_URL: postgresql://admin:adminkbo@127.0.0.1:5432/kbo_test
      TEST_ADMIN_DATABASE_URL: postgresql://admin:adminkbo@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/collector/requirements.txt
            backend/collector/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Run collector integration tests
        run: python -m pytest tests/integration -q
